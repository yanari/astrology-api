# Render's free tier sleeps after 15 minutes without traffic and takes ~60s to wake up,
# which leaves people opening a shared result staring at a loading screen.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://astrology-api-9m77.onrender.com/
